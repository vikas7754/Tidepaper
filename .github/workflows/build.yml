name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Tidepaper.app
        run: scripts/build-app.sh

      - name: Zip
        run: ditto -c -k --keepParent build/Tidepaper.app build/Tidepaper.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tidepaper
          path: build/Tidepaper.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" build/Tidepaper.zip --title "Tidepaper $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
