name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Tidepaper.app
        run: scripts/build-app.sh

      - name: Zip
        run: ditto -c -k --keepParent build/Tidepaper.app build/Tidepaper.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tidepaper
          path: build/Tidepaper.zip
